name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  detectors:
    name: Detector tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Detect on the example file (expects findings)
        # Exit code 1 means "findings reported", which is what this file must produce.
        run: |
          set +e
          python -m cli.main detect examples/sample_violations.cpp
          test $? -eq 1
      - name: Offline review of the example file (no model, no API key)
        run: |
          set +e
          python -m cli.main review examples/sample_violations.cpp --provider offline
          test $? -eq 1
