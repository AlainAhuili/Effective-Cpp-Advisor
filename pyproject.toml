[project]
name = "effective-cpp-advisor"
version = "0.1.0"
description = "Agentic C++ code review: Clang AST detection, RAG-grounded LLM explanations"
requires-python = ">=3.11"
dependencies = ["libclang>=18"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
